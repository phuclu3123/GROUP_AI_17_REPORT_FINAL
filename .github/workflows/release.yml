name: Build Windows Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r VRP_GA_2_APP/requirements.txt -r requirements-dev.txt

      - name: Build application
        shell: pwsh
        run: pyinstaller --noconfirm --clean packaging/VRP-GA-Solver.spec

      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Compress-Archive -Path "dist/VRP-GA-Solver/*" -DestinationPath "release/VRP-GA-Solver-Windows.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRP-GA-Solver-Windows
          path: release/VRP-GA-Solver-Windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = "release/VRP-GA-Solver-Windows.zip"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes
          }
